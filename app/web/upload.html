<!-- app/web/upload.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档上传 - RAG智能问答系统</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/upload.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- 左侧边栏导航 -->
        <div class="sidebar-nav">
            <div class="logo">📚 RAG智能问答系统</div>

            <div class="sidebar-user" id="sidebarUser">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="userNameDisplay">加载中...</span>
                    <span id="userRoleBadge" class="user-role-badge">普通用户</span>
                </div>
                <button class="btn-logout" id="logoutBtn" title="退出登录">
                    <i class="fas fa-sign-out-alt"></i>
                    退出登录
                </button>
            </div>

            <div class="nav-menu">
                <a href="/upload" class="nav-item active">
                    <span class="nav-icon">📤</span>
                    <span>上传文档</span>
                </a>
                <a href="/chat" class="nav-item">
                    <span class="nav-icon">💬</span>
                    <span>智能问答</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span class="status-text">检测中...</span>
                </div>
            </div>
        </div>

        <!-- 右侧主内容区域 -->
        <div class="main-content">
            <!-- 主卡片 -->
            <div class="card">
                <div class="card-title">📄 文档上传与处理</div>
                <div class="card-subtitle">上传文档后，系统将自动进行解析、分块、向量化并存入知识库</div>

                <!-- 上传区域 -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击或拖拽文件到此区域上传</div>
                    <div class="upload-hint">支持 PDF、DOCX、TXT、MD 格式，最大 50MB</div>
                    <input type="file" id="fileInput" class="file-input" accept=".pdf,.docx,.txt,.md,.markdown" multiple>
                </div>

                <!-- ========== 新增：批量上传工具栏 ========== -->
                <div class="batch-upload-toolbar" id="batchUploadToolbar" style="display: none;">
                    <div class="batch-upload-info">
                        <span class="batch-count" id="batchFileCount">已选择 0 个文件</span>
                        <span class="batch-total-size" id="batchTotalSize"></span>
                    </div>
                    <div class="batch-upload-actions">
                        <button class="btn-clear-batch" id="clearBatchBtn">清空列表</button>
                        <button class="btn-upload-batch" id="uploadBatchBtn">📤 批量上传</button>
                    </div>
                </div>

                <!-- ========== 新增：待上传文件列表 ========== -->
                <div class="pending-files-container" id="pendingFilesContainer" style="display: none;">
                    <div class="pending-files-header">
                        <span>📋 待上传文件列表</span>
                        <span class="pending-files-hint">点击文件可移除</span>
                    </div>
                    <div class="pending-files-list" id="pendingFilesList"></div>
                </div>

                <!-- 配置面板 -->
                <div class="config-panel">
                    <div class="config-title">⚙️ 处理配置</div>
                    <div class="config-grid">
                        <div class="config-item">
                            <label class="config-label">分块大小 (Token)</label>
                            <input type="number" id="chunkSize" class="config-input" value="256" step="32">
                        </div>
                        <div class="config-item">
                            <label class="config-label">起始页 (PDF)</label>
                            <input type="number" id="fromPage" class="config-input" value="0" min="0">
                        </div>
                        <div class="config-item">
                            <label class="config-label">结束页 (PDF)</label>
                            <input type="number" id="toPage" class="config-input" value="100000" min="1">
                        </div>
                        <div class="config-item config-checkbox">
                            <input type="checkbox" id="enableVectorization" checked>
                            <label class="config-label">启用向量化</label>
                        </div>
                        <div class="config-item config-checkbox">
                            <input type="checkbox" id="enableStorage" checked>
                            <label class="config-label">启用存储</label>
                        </div>
                        <div class="config-item config-checkbox">
                            <input type="checkbox" id="concurrentUpload" checked>
                            <label class="config-label">并发上传</label>
                            <span class="config-hint">(同时上传多个文件)</span>
                        </div>
                        <div class="config-item">
                            <label class="config-label">并发数</label>
                            <select id="concurrencyLimit" class="config-input" style="width: 70px;">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3" selected>3</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 全局进度条 -->
                <div class="global-progress-container" id="globalProgressContainer" style="display: none;">
                    <div class="global-progress-header">
                        <span>📊 批量上传进度</span>
                        <span id="globalProgressStatus">准备中...</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="globalProgressFill"></div>
                    </div>
                    <div class="global-progress-stats" id="globalProgressStats">
                        已完成: 0 / 0
                    </div>
                </div>

                <!-- 单个文件上传进度列表 -->
                <div class="upload-progress-list" id="uploadProgressList" style="display: none;">
                    <div class="upload-progress-header">
                        <span>📁 文件上传详情</span>
                        <button class="btn-collapse-progress" id="collapseProgressBtn">收起</button>
                    </div>
                    <div class="upload-progress-items" id="uploadProgressItems"></div>
                </div>

                <!-- 原有进度条（保留向后兼容） -->
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">正在处理...</div>
                </div>
            </div>

            <!-- 已上传文档列表 -->
            <div class="card">
                <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>📋 已上传文档</span>
                    <button id="batchDeleteBtn" class="btn-batch-delete" style="display: none;">
                        🗑️ 批量删除 (<span id="selectedCount">0</span>)
                    </button>
                </div>
                <div class="card-subtitle">
                    已处理的文档列表，可删除重新上传
                    <label class="select-all-label" style="margin-left: 16px;">
                        <input type="checkbox" id="selectAllCheckbox"> 全选
                    </label>
                </div>
                <div id="fileList" class="file-list">
                    <div style="text-align: center; color: #999; padding: 32px;">加载中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量上传确认对话框 -->
    <div id="batchConfirmModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <span>确认批量上传</span>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>即将上传以下 <span id="confirmFileCount">0</span> 个文件：</p>
                <div class="confirm-file-list" id="confirmFileList"></div>
                <p class="modal-warning">⚠️ 上传过程可能需要一些时间，请勿关闭页面</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel">取消</button>
                <button class="btn-confirm">开始上传</button>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script type="module" src="/static/js/upload.js"></script>
</body>
</html>
