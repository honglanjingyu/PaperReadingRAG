<!-- app/web/login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - RAG智能问答系统</title>
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">📚</div>
                <h1>RAG 智能问答</h1>
                <p>基于文档的智能问答系统</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>

            <div id="loginPane" class="tab-pane active">
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn" id="loginBtn">登录</button>
                </form>
            </div>

            <div id="registerPane" class="tab-pane">
                <form id="registerForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="registerUsername" placeholder="用户名 (3-50个字符)">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="registerPassword" placeholder="密码 (至少6个字符)">
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="registerConfirmPassword" placeholder="请再次输入密码">
                    </div>
                    <button type="submit" class="btn" id="registerBtn">注册</button>
                </form>
            </div>

            <div class="info-text">
                登录后可使用文档上传和智能问答功能
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';

        const loginPane = document.getElementById('loginPane');
        const registerPane = document.getElementById('registerPane');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');

        function showMessage(paneId, message, isError = true) {
            const pane = document.getElementById(paneId);
            const existingMsg = pane.querySelector('.error-message, .success-message');
            if (existingMsg) existingMsg.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = isError ? 'error-message' : 'success-message';
            msgDiv.textContent = message;
            pane.insertBefore(msgDiv, pane.firstChild);

            setTimeout(() => {
                if (msgDiv.parentNode) msgDiv.remove();
            }, 3000);
        }

        function setLoading(btn, isLoading) {
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner"></span> 处理中...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn.id === 'loginBtn' ? '登录' : '注册';
            }
        }

        function saveToken(token, userId, username) {
            localStorage.setItem('rag_token', token);
            localStorage.setItem('rag_user_id', userId);
            localStorage.setItem('rag_username', username);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username) {
                showMessage('loginPane', '请输入用户名');
                return;
            }
            if (!password) {
                showMessage('loginPane', '请输入密码');
                return;
            }

            setLoading(loginBtn, true);

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    saveToken(data.token, data.user_id, data.username);
                    showMessage('loginPane', data.message, false);
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 1000);
                } else {
                    showMessage('loginPane', data.message);
                }
            } catch (error) {
                showMessage('loginPane', '网络错误: ' + error.message);
            } finally {
                setLoading(loginBtn, false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;

            if (!username) {
                showMessage('registerPane', '请输入用户名');
                return;
            }
            if (username.length < 3 || username.length > 50) {
                showMessage('registerPane', '用户名长度应为 3-50 个字符');
                return;
            }
            if (!password) {
                showMessage('registerPane', '请输入密码');
                return;
            }
            if (password.length < 6) {
                showMessage('registerPane', '密码长度至少为 6 个字符');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('registerPane', '两次输入的密码不一致');
                return;
            }

            setLoading(registerBtn, true);

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('registerPane', data.message, false);
                    setTimeout(() => {
                        document.querySelector('.tab-btn[data-tab="login"]').click();
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').focus();
                    }, 1500);
                } else {
                    showMessage('registerPane', data.message);
                }
            } catch (error) {
                showMessage('registerPane', '网络错误: ' + error.message);
            } finally {
                setLoading(registerBtn, false);
            }
        }

        function switchTab(tabName) {
            if (tabName === 'login') {
                loginPane.classList.add('active');
                registerPane.classList.remove('active');
            } else {
                loginPane.classList.remove('active');
                registerPane.classList.add('active');
            }

            tabBtns.forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const messages = document.querySelectorAll('.error-message, .success-message');
            messages.forEach(msg => msg.remove());
        }

        function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('rag_token');
            if (token && token !== 'null' && token !== 'undefined') {
                window.location.href = '/chat';
            }
        }

        loginForm.addEventListener('submit', handleLogin);
        registerForm.addEventListener('submit', handleRegister);
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });

        document.getElementById('loginPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin(e);
        });
        document.getElementById('registerConfirmPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister(e);
        });

        checkAlreadyLoggedIn();
    </script>
</body>
</html>
