# app/service/graphrag_configs/relation_types.yml
# 关系类型定义 - 用于知识图谱可视化和关系识别

relation_types:
  # 公司内部关系
  CHAIRMAN_OF:
    name: "担任董事长"
    description: "人物担任公司的董事长"
    source_type: "PERSON"
    target_type: "COMPANY"
    direction: "directed"
    weight: 1.2
    color: "#f59e0b"
    label: "董事长"

  CEO_OF:
    name: "担任CEO"
    description: "人物担任公司的首席执行官"
    source_type: "PERSON"
    target_type: "COMPANY"
    direction: "directed"
    weight: 1.2
    color: "#f59e0b"
    label: "CEO"

  FOUNDED_BY:
    name: "由...创办"
    description: "公司由人物创办"
    source_type: "COMPANY"
    target_type: "PERSON"
    direction: "directed"
    weight: 1.3
    color: "#10b981"
    label: "创办"

  # 产品关系
  PRODUCES:
    name: "生产/提供"
    description: "公司生产某产品或提供某服务"
    source_type: "COMPANY"
    target_type: "PRODUCT"
    direction: "directed"
    weight: 1.0
    color: "#3b82f6"
    label: "生产"

  # 竞争关系
  COMPETES_WITH:
    name: "竞争对手"
    description: "公司与公司存在竞争关系"
    source_type: "COMPANY"
    target_type: "COMPANY"
    direction: "undirected"
    weight: 1.0
    color: "#ef4444"
    label: "竞争"

  # 合作关系
  COOPERATES_WITH:
    name: "合作关系"
    description: "公司与公司有合作"
    source_type: "COMPANY"
    target_type: "COMPANY"
    direction: "undirected"
    weight: 0.8
    color: "#10b981"
    label: "合作"

  # 供应关系
  SUPPLIES_TO:
    name: "供应给"
    description: "公司向另一公司供应产品"
    source_type: "COMPANY"
    target_type: "COMPANY"
    direction: "directed"
    weight: 0.9
    color: "#14b8a6"
    label: "供应"

  # 资本关系
  ACQUIRED:
    name: "收购"
    description: "公司收购另一公司"
    source_type: "COMPANY"
    target_type: "COMPANY"
    direction: "directed"
    weight: 1.5
    color: "#ec4899"
    label: "收购"

  INVESTED_IN:
    name: "投资"
    description: "机构或个人投资公司"
    source_type: "ORGANIZATION"
    target_type: "COMPANY"
    direction: "directed"
    weight: 1.2
    color: "#8b5cf6"
    label: "投资"

  # 行业归属
  BELONGS_TO:
    name: "属于行业"
    description: "公司属于某行业"
    source_type: "COMPANY"
    target_type: "SECTOR"
    direction: "directed"
    weight: 0.8
    color: "#6b7280"
    label: "属于"

  # 地点关系
  LOCATED_IN:
    name: "位于"
    description: "公司位于某地"
    source_type: "COMPANY"
    target_type: "LOCATION"
    direction: "directed"
    weight: 0.6
    color: "#14b8a6"
    label: "位于"

  # 技术关系
  USES_TECHNOLOGY:
    name: "使用技术"
    description: "公司或产品使用某技术"
    source_type: "COMPANY"
    target_type: "TECHNOLOGY"
    direction: "directed"
    weight: 0.7
    color: "#3b82f6"
    label: "使用"