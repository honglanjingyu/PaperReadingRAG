# app/service/graphrag_configs/entity_extraction.yaml
# 实体提取配置文件 - 用于从用户问题中提取实体

# 从问题中提取实体的正则表达式模式
entity_extraction_patterns:
  # 企业/组织相关
  - r'([\u4e00-\u9fff]{2,})公司'
  - r'([\u4e00-\u9fff]{2,})集团'
  - r'([\u4e00-\u9fff]{2,})股份'
  - r'([\u4e00-\u9fff]{2,})有限'
  - r'([\u4e00-\u9fff]{2,})银行'
  - r'([\u4e00-\u9fff]{2,})基金'
  - r'([\u4e00-\u9fff]{2,})证券'
  - r'([\u4e00-\u9fff]{2,})保险'
  - r'([\u4e00-\u9fff]{2,})科技'
  - r'([\u4e00-\u9fff]{2,})技术'

  # 技术相关
  - r'([\u4e00-\u9fff]{2,})技术'
  - r'([\u4e00-\u9fff]{2,})算法'
  - r'([\u4e00-\u9fff]{2,})模型'
  - r'([\u4e00-\u9fff]{2,})框架'
  - r'([\u4e00-\u9fff]{2,})平台'
  - r'([\u4e00-\u9fff]{2,})系统'
  - r'([\u4e00-\u9fff]{2,})工具'

  # 产品相关
  - r'([\u4e00-\u9fff]{2,})产品'
  - r'([\u4e00-\u9fff]{2,})项目'
  - r'([\u4e00-\u9fff]{2,})方案'
  - r'([\u4e00-\u9fff]{2,})解决方案'
  - r'([\u4e00-\u9fff]{2,})电池'
  - r'([\u4e00-\u9fff]{2,})芯片'

  # 行业术语
  - r'([\u4e00-\u9fff]{2,})行业'
  - r'([\u4e00-\u9fff]{2,})领域'
  - r'([\u4e00-\u9fff]{2,})赛道'

  # 融资相关
  - r'([\u4e00-\u9fff]{2,})融资'
  - r'([\u4e00-\u9fff]{2,})轮'
  - r'([\u4e00-\u9fff]{2,})投资'

  # 财务指标
  - r'([\u4e00-\u9fff]{2,})营收'
  - r'([\u4e00-\u9fff]{2,})利润'
  - r'([\u4e00-\u9fff]{2,})收入'
  - r'([\u4e00-\u9fff]{2,})净利润'

  # 时间相关
  - r'(\d{4})年'
  - r'(\d{4})年Q\d'
  - r'(\d{4})年第一季度'

# 实体长度限制
min_entity_length: 2
max_entity_length: 50

# 是否启用别名匹配
enable_alias_matching: true

# 是否从问题中提取新实体
enable_new_entity_extraction: true

# 最大提取实体数量
max_extracted_entities: 20

# 别名匹配策略
alias_matching_strategy: hybrid

# 是否忽略大小写
case_insensitive: true