# app/service/graphrag_configs/entity_types.yml
# 实体类型定义 - 用于知识图谱可视化和类型识别

entity_types:
  COMPANY:
    name: "公司"
    description: "企业、上市公司、集团等商业实体"
    priority: 1
    color: "#667eea"
    icon: "building"
    search_weight: 1.0

  PERSON:
    name: "人物"
    description: "创始人、高管、核心团队成员等"
    priority: 2
    color: "#f59e0b"
