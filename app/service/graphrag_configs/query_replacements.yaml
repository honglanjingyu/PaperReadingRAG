# 查询替换规则
# 用于 GraphRAG 问答时替换问题中的别名

query_replacements:
  # 格式: "别名": "完整名称(即别名)"
  - alias: "云创科技"
    replacement: "云创科技股份有限公司(即云创科技)"

  - alias: "云创"
    replacement: "云创科技股份有限公司(即云创)"

  - alias: "阿里"
    replacement: "阿里巴巴集团(即阿里)"

  - alias: "腾讯"
    replacement: "腾讯控股有限公司(即腾讯)"

  - alias: "百度"
    replacement: "百度集团股份有限公司(即百度)"

  - alias: "清华"
    replacement: "清华大学(即清华)"

  - alias: "北大"
    replacement: "北京大学(即北大)"

  - alias: "RAG"
    replacement: "RAG(检索增强生成技术)"

# 是否启用查询替换
enable_query_replacement: true

# 替换顺序（长别名优先）
sort_by_length: true