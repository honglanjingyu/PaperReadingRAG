# 实体别名映射
# 将简称/别名映射到标准实体名称

entity_aliases:
  # 公司别名
  云创科技: "云创科技股份有限公司"
  云创: "云创科技股份有限公司"
  阿里巴巴: "阿里巴巴集团"
  阿里: "阿里巴巴集团"
  腾讯: "腾讯控股有限公司"
  百度: "百度集团股份有限公司"
  华为: "华为技术有限公司"
  小米: "小米集团"
  京东: "京东集团"
  字节: "字节跳动有限公司"
  字节跳动: "字节跳动有限公司"

  # 机构别名
  清华: "清华大学"
  北大: "北京大学"
  上交: "上海交通大学"
  浙大: "浙江大学"
  中科大: "中国科学技术大学"
  哈工大: "哈尔滨工业大学"
  复旦: "复旦大学"
  南大: "南京大学"

  # 实验室/研究中心别名
  清华-云创: "清华-云创智能计算联合实验室"
  云创实验室: "清华-云创智能计算联合实验室"

  # 技术/产品别名
  ChatGPT: "ChatGPT"
  GPT: "GPT"
  RAG: "RAG技术"
  向量检索: "Vector Search"

# 别名匹配策略
alias_matching:
  # exact: 精确匹配
  # contains: 包含匹配
  # fuzzy: 模糊匹配
  default_strategy: "exact"

  # 为特定别名指定匹配策略
  strategies:
    云创: "contains"
    清华: "contains"

# 是否在匹配时忽略大小写
case_insensitive: true