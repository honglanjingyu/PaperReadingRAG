# 关系模式配置
# 用于提取实体之间的关系

relation_patterns:
  - pattern: "(.+?)(?:是|为)(.+?)的?(?:子|分|母)?公司"
    relation_type: "SUBSIDIARY_OF"
    description: "子公司关系"

  - pattern: "(.+?)(?:位于|坐落于|地处|位于)(.+)"
    relation_type: "LOCATED_IN"
    description: "位于关系"

  - pattern: "(.+?)(?:成立|创办|创建|设立)于(.+?)年"
    relation_type: "FOUNDED_IN"
    description: "成立于"

  - pattern: "(.+?)CEO(?:是|为)(.+)"
    relation_type: "CEO_OF"
    description: "CEO关系"

  - pattern: "(.+?)董事长(?:是|为)(.+)"
    relation_type: "CHAIRMAN_OF"
    description: "董事长关系"

  - pattern: "(.+?)员工(?:数|数量)为(.+?)人"
    relation_type: "HAS_EMPLOYEES"
    description: "员工数量"

  - pattern: "(.+?)营收(?:为|达到)(.+?)亿元"
    relation_type: "REVENUE_OF"
    description: "营收关系"

  - pattern: "(.+?)(?:与|和)(.+?)(?:合作|达成合作|战略合作)"
    relation_type: "COOPERATES_WITH"
    description: "合作关系"

  - pattern: "(.+?)(?:投资|入股|收购)(.+)"
    relation_type: "INVESTS_IN"
    description: "投资关系"

  - pattern: "(.+?)(?:研发|开发|推出)(.+)"
    relation_type: "DEVELOPS"
    description: "开发关系"

  - pattern: "(.+?)(?:使用|采用|应用)(.+)"
    relation_type: "USES"
    description: "使用关系"

  - pattern: "(.+?)(?:包含|包括|由.*组成)(.+)"
    relation_type: "CONTAINS"
    description: "包含关系"

  - pattern: "(.+?)(?:导致|引起|造成)(.+)"
    relation_type: "LEADS_TO"
    description: "导致关系"

  - pattern: "(.+?)(?:属于|隶属于)(.+)"
    relation_type: "BELONGS_TO"
    description: "隶属于关系"

# 关系方向
relation_direction:
  SUBSIDIARY_OF: "directed"      # source -> target: 子公司
  LOCATED_IN: "directed"         # source -> target: 位于
  FOUNDED_IN: "directed"         # source -> target: 成立于年代
  COOPERATES_WITH: "undirected"  # 无向关系
  INVESTED_IN: "directed"        # source -> target: 投资
  DEVELOPED_BY: "directed"       # source <- target: 被开发

# 关系权重配置
default_relation_weight: 1.0
max_relation_weight: 5.0