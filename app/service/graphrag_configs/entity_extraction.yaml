# app/service/graphrag_configs/entity_extraction.yaml
# 实体提取配置文件 - 用于从用户问题中提取实体

# 从问题中提取实体的正则表达式模式
entity_extraction_patterns:
  # 企业/组织相关
  - r'([\u4e00-\u9fff]{2,})公司'
  - r'([\u4e00-\u9fff]{2,})集团'
  - r'([\u4e00-\u9fff]{2,})股份'
  - r'([\u4e00-\u9fff]{2,})有限'
  - r'([\u4e00-\u9fff]{2,})银行'
  - r'([\u4e00-\u9fff]{2,})基金'
  - r'([\u4e00-\u9fff]{2,})证券'
  - r'([\u4e00-\u9fff]{2,})保险'

  # 技术相关
  - r'([\u4e00-\u9fff]{2,})技术'
  - r'([\u4e00-\u9fff]{2,})算法'
  - r'([\u4e00-\u9fff]{2,})模型'
  - r'([\u4e00-\u9fff]{2,})框架'
  - r'([\u4e00-\u9fff]{2,})平台'
  - r'([\u4e00-\u9fff]{2,})系统'
  - r'([\u4e00-\u9fff]{2,})工具'
  - r'([\u4e00-\u9fff]{2,})服务'
  - r'([\u4e00-\u9fff]{2,})引擎'

  # 产品相关
  - r'([\u4e00-\u9fff]{2,})产品'
  - r'([\u4e00-\u9fff]{2,})项目'
  - r'([\u4e00-\u9fff]{2,})方案'
  - r'([\u4e00-\u9fff]{2,})解决方案'

  # 英文技术名词（大写开头）
  - r'([A-Z][a-z]+)技术'
  - r'([A-Z][a-z]+)算法'
  - r'([A-Z][a-z]+)模型'
  - r'([A-Z][a-z]+)框架'
  - r'([A-Z][a-z]+)引擎'

  # 英文缩写（3-5个大写字母）
  - r'([A-Z]{3,5})'

  # 中文名词（3-10个字符的连续中文）
  - r'([\u4e00-\u9fff]{3,10})'

# 实体长度限制
min_entity_length: 2
max_entity_length: 50

# 是否启用别名匹配
enable_alias_matching: true

# 是否从问题中提取新实体
enable_new_entity_extraction: true

# 最大提取实体数量
max_extracted_entities: 20