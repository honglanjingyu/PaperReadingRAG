services:
  neo4j:
    image: neo4j:5.21
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
      - "7473:7473"
    environment:
      # 基础认证（必须）
      - NEO4J_AUTH=neo4j/RagNeo4j2024!
      
      # APOC 插件（需要）
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      
      # 网络配置（必须）
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      
      # 数据库配置
      - NEO4J_dbms_default__database=rag
      
      # 内存配置（可选但推荐）
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=2G
      
      # 事务超时（可选）
      - NEO4J_dbms_transaction_timeout=60s
    volumes:
      - E:/neo4j_data/data:/data
      - E:/neo4j_data/logs:/logs
      - E:/neo4j_data/import:/var/lib/neo4j/import
      - E:/neo4j_data/plugins:/plugins
      - E:/neo4j_data/conf:/conf
      - E:/neo4j_data/backups:/backups
    networks:
      - rag_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  rag_network:
    driver: bridge
    name: rag_network