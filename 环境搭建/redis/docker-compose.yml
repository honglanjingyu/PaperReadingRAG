version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - E:/redis_data:/data
    environment:
      - TZ=Asia/Shanghai
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --dir /data
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  redis-network:
    driver: bridge